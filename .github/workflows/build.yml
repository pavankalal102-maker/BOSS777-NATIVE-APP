name: Build Native Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare Assets & Web Directory
      run: |
        mkdir -p www
        cp index.html www/
        cp -r main-app www/ 2>/dev/null || true
        cp -r review-app www/ 2>/dev/null || true
        
        # Icon & Splash Screen Assets directory setup
        mkdir -p assets
        if [ -f logo.png ]; then
          cp logo.png assets/icon-only.png
          cp logo.png assets/icon-foreground.png
          cp logo.png assets/icon-background.png
          cp logo.png assets/splash.png
          cp logo.png assets/splash-dark.png
        fi

    - name: Install Capacitor CLI & Assets Tool
      run: |
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest

    - name: Initialize & Sync Capacitor Project
      run: |
        npx cap init "BOSS777" "com.boss777.hub" --web-dir www
        npx cap add android
        
        # Generate Native App Icons & Splash Screen with White Background
        if [ -f logo.png ]; then
          npx cap-assets generate --android --iconBackgroundColor "#ffffff" --splashBackgroundColor "#ffffff"
        fi
        
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOSS777-Native-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
